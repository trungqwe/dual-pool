name: Source CI

on:
  push:
    branches:
      - 'phase-1/**'
      - main
  pull_request:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false
      - name: Go format
        run: |
          go fmt ./...
          git diff --exit-code
      - name: Verify Go modules
        run: go mod verify
      - name: Go vet
        run: go vet ./...
      - name: Go tests
        run: go test ./...
      - name: Windows executable build
        run: go build -o "$env:RUNNER_TEMP\poolbridge.exe" ./cmd/poolbridge
      - name: Phase 0 regression tests
        run: node --test scripts/*.test.cjs
      - name: Candidate lock validation
        run: node scripts/phase0-upstream-lock.cjs
